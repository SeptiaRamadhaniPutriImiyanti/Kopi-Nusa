<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="500" fill="#b89d67" rx="10"/>
  
  <!-- Saucer (Piring Cangkir) -->
  <ellipse cx="250" cy="380" rx="190" ry="40" fill="#e2d4c9" stroke="#5c3219" stroke-width="6"/>
  <ellipse cx="250" cy="375" rx="160" ry="35" fill="#f5ebe6" stroke="#8b4513" stroke-width="4"/>

  <!-- Biji Kopi -->
  <g fill="#4a2511" stroke="#2c1810" stroke-width="2">
    <ellipse cx="120" cy="380" rx="18" ry="12" transform="rotate(-20 120 380)"/>
    <ellipse cx="150" cy="395" rx="16" ry="10" transform="rotate(15 150 395)"/>
    <ellipse cx="370" cy="385" rx="18" ry="12" transform="rotate(30 370 385)"/>
  </g>

  <!-- Gagang Cangkir -->
  <path d="M 350 210 C 430 210, 420 320, 335 320" fill="none" stroke="#8b4513" stroke-width="24" stroke-linecap="round"/>
  <path d="M 350 210 C 430 210, 420 320, 335 320" fill="none" stroke="#f5ebe6" stroke-width="14" stroke-linecap="round"/>

  <!-- Cangkir Kopi -->
  <path d="M 130 190 L 370 190 L 340 330 C 340 360, 160 360, 160 330 Z" fill="#f5ebe6" stroke="#8b4513" stroke-width="6"/>
  
  <!-- Kopi & Latte Art Hati -->
  <ellipse cx="250" cy="190" rx="120" ry="25" fill="#5e3726" stroke="#8b4513" stroke-width="5"/>
  <ellipse cx="250" cy="190" rx="105" ry="20" fill="#5c3219"/>
  <path d="M 250,182 A 8,8 0 0,0 235,182 A 8,8 0 0,0 250,195 A 8,8 0 0,0 265,182 A 8,8 0 0,0 250,182 Z" fill="#f5ebe6" opacity="0.9"/>

  <!-- Tulisan Coffee -->
  <text x="250" y="275" font-family="sans-serif" font-size="38" font-weight="bold" fill="#5c3219" text-anchor="middle">Coffee</text>

  <!-- Uap Hati -->
  <path d="M 230 150 C 210 120, 230 90, 250 70 C 270 90, 290 120, 270 150 Z" fill="none" stroke="#d97706" stroke-width="4" opacity="0.6"/>
</svg>
